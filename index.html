<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#001121">
  <title>iDance — Find your sound</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <!-- A fixed 1080 × 1920 canvas scales to fit the available screen. -->
  <div class="screen" id="screen">
    <main class="kiosk" id="main" inert>
      <div class="music-background" id="music-background" aria-hidden="true"></div>
      <div class="stage-lights" aria-hidden="true">
        <span class="stage-light stage-light-left"></span>
        <span class="stage-light stage-light-right"></span>
      </div>
      <header class="header">
        <div class="brands" aria-label="iDance and King Jouet">
          <img class="idance-logo" src="assets/logo-H.svg" alt="iDance">
          <img class="king-logo" src="assets/kj.png" alt="King Jouet">
        </div>
      </header>

      <section class="demo" aria-label="Product demonstration">
        <video id="demo-video" controls playsinline preload="metadata" poster="assets/demo-poster.jpg" src="vo/G600L_PACK_EN_10MB.mp4"></video>
        <button class="demo-overlay" id="play-demo" aria-label="Play product demonstration">
          <span class="play-circle" aria-hidden="true"><svg viewBox="0 0 60 60"><path d="M16 7 55 30 16 53Z"/></svg></span>
        </button>
      </section>

      <section class="categories" aria-label="Product categories">
        <div class="category-grid" id="categories"></div>
      </section>

      <section class="spotlight" aria-label="Products">
        <p class="product-count" id="product-count" aria-live="polite" hidden></p>
        <div class="product-grid" id="products"></div>
      </section>

    </main>

    <!-- Audio falls back to muted playback if autoplay is restricted. -->
    <button class="intro" id="intro" aria-label="Tap anywhere to enter iDance">
      <video id="intro-video" src="vo/web-voB.mp4" autoplay loop playsinline preload="auto"></video>
    </button>
    <button class="intro-sound" id="intro-sound" aria-label="Mute opening video" aria-pressed="false">Mute</button>

  </div>
</body>
</html>
